<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overhead</title>
<style>
:root{
  --bg:#0e1014; --panel:#15181e; --panel2:#1b1f27; --hover:#222733; --line:#252a34; --line2:#313745;
  --text:#e7e9ee; --muted:#8c94a6; --dim:#5d6577; --accent:#6ea8ff; --accent-bg:rgba(110,168,255,.14);
  --set:#ffb86b; --set-bg:rgba(255,184,107,.15);
  --danger:#ff6b6b; --ok:#4cd6a0; --canvas:#12151b; --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex:none;display:block}

#app{display:grid;grid-template-columns:260px 1fr 290px;grid-template-rows:48px 1fr;height:100vh}
#app.list #stage,#app.list #inspector{display:none}
#app:not(.list) #shotlist{display:none}
#app.home #sidebar,#app.home #stage,#app.home #inspector,#app.home #shotlist,#app.home .proj-only{display:none!important}
#app:not(.home) #home{display:none}

/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;cursor:pointer;user-select:none}
.mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6ea8ff,#b48cff);display:grid;place-items:center}
.crumbs{display:flex;align-items:center;gap:2px;margin-left:6px}
.crumb{border:0;background:transparent;color:var(--muted);padding:5px 8px;border-radius:6px;display:flex;gap:6px;align-items:center}
.crumb:hover{background:var(--hover);color:var(--text)}
.slash{color:var(--dim)}
#projName{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:220px;color:var(--text);font-weight:600}
#projName:hover{border-color:var(--line2)} #projName:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;margin:0 auto}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--panel2);color:var(--text)}
.hbtns{display:flex;gap:2px;align-items:center}
.ib{border:0;background:transparent;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--muted);position:relative}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:disabled{opacity:.35;pointer-events:none}
.sep{width:1px;height:20px;background:var(--line2);margin:0 6px;flex:none}

/* home */
#home{grid-column:1/-1;overflow:auto;padding:36px 48px 60px}
.home-head{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.home-head h1{margin:0;font-size:24px;flex:1}
.home-foot{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);flex-wrap:wrap}
.home-foot .linkish{background:none;border:0;color:var(--text);font:inherit;cursor:pointer;padding:2px 4px;border-radius:4px;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-foot .linkish:hover{background:var(--hover, rgba(255,255,255,.06));text-decoration:underline}
.home-foot .ver{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.thumb{aspect-ratio:16/10;background:var(--canvas);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.pcard .meta{padding:12px 14px}
.pcard .meta b{display:block;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta span{font-size:12px;color:var(--muted)}
.pcard .more{position:absolute;top:8px;right:8px;background:rgba(14,16,20,.75)}
.newcard{border:1.5px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--muted);min-height:220px;background:transparent}
.newcard:hover{border-color:var(--accent);color:var(--accent)}

/* sidebar */
#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh-title{display:flex;align-items:center;gap:2px;padding:10px 8px 6px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.sh-title span{flex:1}
.sh-title .ib{width:26px;height:26px}
#scenes{overflow:auto;padding:0 6px 16px;flex:1}
.scene-head{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;user-select:none}
.scene-head:hover{background:var(--hover)}
.scene.active>.scene-head{background:var(--panel2)}
.scene.active.selected>.scene-head{background:var(--accent-bg)}
.caret{width:16px;height:16px;display:grid;place-items:center;color:var(--dim);transition:transform .15s}
.scene.open .caret{transform:rotate(90deg)}
.snum{font-weight:700;color:var(--accent);min-width:14px}
.sname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.count{font-size:11px;color:var(--dim);background:var(--bg);padding:0 6px;border-radius:10px}
.shots{padding:2px 0 6px 22px}
.shot{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--muted);border:1px solid transparent}
.shot:hover{background:var(--hover);color:var(--text)}
.shot.sel{background:var(--accent-bg);color:var(--text);border-color:rgba(110,168,255,.3)}
.shot.drop,.addshot.drop{border-top-color:var(--accent)}
.shot .sn{font-weight:700;color:var(--text);min-width:24px}
.tag{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--bg);color:var(--muted);letter-spacing:.03em}
.shot .sd{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.shot .done{color:var(--ok)}
.addshot{display:flex;align-items:center;gap:6px;border:0;border-top:1px solid transparent;background:transparent;color:var(--dim);padding:5px 8px;border-radius:6px;width:100%;text-align:left;font-size:12px}
.addshot:hover{color:var(--accent);background:var(--hover)}
.lpin{color:var(--set);display:grid;place-items:center}
#locs,#chars{max-height:22%;overflow:auto;padding:0 6px 12px}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #0d0f14;box-shadow:0 0 0 1px var(--line2)}
.char-row{cursor:grab}
.setups{display:flex;gap:4px;flex-wrap:wrap;padding:2px 8px 6px 8px}
.su{border:1px solid var(--line2);background:var(--bg);color:var(--muted);border-radius:6px;height:22px;padding:0 7px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;max-width:120px;position:relative}
.su span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su span:empty{display:none}
.su:hover{color:var(--text);border-color:var(--dim)}
.su.on{background:var(--accent-bg);border-color:rgba(110,168,255,.45);color:var(--accent)}
.su.add{border-style:dashed}
.stag{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:15px}
.stag.on{color:var(--accent);border-color:rgba(110,168,255,.45)}
.loc-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--muted)}
.loc-row:hover{background:var(--hover);color:var(--text)}
.loc-row .ic{color:var(--set)}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.loc-card{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:0;overflow:hidden;text-align:left;color:var(--text)}
.loc-card:hover{border-color:var(--accent)}
.loc-card .meta{padding:8px 10px}
.loc-card .meta b{display:block;font-size:13px}
.loc-card .meta span{font-size:11.5px;color:var(--muted)}
.btn{position:relative}

/* stage */
#stage{position:relative;container-type:inline-size;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#stage.setmode::after{content:'';position:absolute;inset:0;border:2px solid rgba(255,184,107,.35);pointer-events:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#canvas [data-id]{cursor:move}
#canvas [data-handle=rot]{cursor:grab}
#canvas [data-handle=resize]{cursor:nwse-resize}
#canvas [data-handle=v],#canvas [data-handle=ap]{cursor:pointer}
#canvas [data-handle=vm],#canvas [data-handle=am]{cursor:copy}
#canvas.placing,#canvas.placing [data-id],#canvas.placing [data-lock]{cursor:crosshair}
#canvas.panning,#canvas.panning [data-id]{cursor:grab}
.float{position:absolute;background:rgba(21,24,30,.92);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toolbar{top:12px;left:12px;right:12px;width:max-content;max-width:calc(100% - 24px);margin:0 auto;display:flex;align-items:center;gap:2px;padding:4px;overflow-x:auto}
.mode{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;margin-right:4px;flex:none}
.mode button{border:0;background:transparent;color:var(--muted);padding:0 10px;height:28px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;position:relative}
.mode button.on[data-mode=set]{background:var(--set-bg);color:var(--set)}
.mode button.on[data-mode=block]{background:var(--accent-bg);color:var(--accent)}
.tool{border:0;background:transparent;height:34px;min-width:34px;padding:0 6px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);position:relative;flex:none}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.on{background:var(--accent-bg);color:var(--accent)}
.tool svg.pi{width:22px;height:22px}
.tool .lbl{font-size:12px}
#toolbar{scrollbar-width:none}
@container (max-width:1020px){.tool .lbl{display:none}.tool{min-width:32px;padding:0 4px}}
.tool.toggle.on{background:transparent;color:var(--accent)}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#000;color:#fff;font-size:11px;padding:4px 7px;border-radius:5px;pointer-events:none;z-index:10;font-weight:500}
#playbar{bottom:14px;left:14px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;width:min(460px,calc(100% - 250px))}
#playbar input[type=range]{flex:1;accent-color:var(--accent)}
#playbar .pl{font-size:11px;color:var(--muted);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
#playbar.off{opacity:.55}
#zoomui{bottom:14px;right:14px;display:flex;align-items:center;gap:2px;padding:3px;font-size:11px;color:var(--muted)}
#zoomui span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#banner{top:62px;left:14px;padding:10px 14px;max-width:360px;display:none}
#banner.show{display:block}
#banner .bn{font-size:18px;font-weight:700}
#banner .bm{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap}
#banner .bd{color:var(--muted);font-size:12px}
#hint{bottom:66px;left:50%;transform:translateX(-50%);padding:6px 12px;font-size:12px;color:var(--muted);display:none;white-space:nowrap;pointer-events:none}
#hint.show{display:block}
#hint b{color:var(--set)}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);pointer-events:none;display:none;line-height:1.6}
#empty.show{display:block}
#empty b{color:var(--muted);display:block;font-size:15px;margin-bottom:4px}

/* inspector */
#inspector{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ih .kind{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);padding:3px 7px;border-radius:5px}
.ih .kind.set{color:var(--set);background:var(--set-bg)}
.ih h2{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:6px}
.st{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;outline:none}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.unit{position:relative}.unit input{padding-right:28px}.unit i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--dim);pointer-events:none}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:7px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#081020;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:var(--bg);border-radius:14px;min-width:28px;height:26px;padding:0 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#081020}
.hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin:6px 0 10px}
.hint kbd,.kb kbd,#hint kbd,#empty kbd{background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:11px ui-monospace,monospace;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{accent-color:var(--ok);width:16px;height:16px}
.stat{display:flex;justify-content:space-between;color:var(--muted);padding:3px 0}
.stat b{color:var(--text);font-weight:600}

/* shot list */
#shotlist{grid-column:2/-1;overflow:auto;padding:24px 32px 60px;background:var(--bg)}
.sl-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sl-head h1{font-size:20px;margin:0;flex:1}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2);position:sticky;top:-24px;background:var(--bg)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.srow td{padding-top:22px;font-weight:700;color:var(--accent);border-bottom-color:var(--line2)}
tr.srow td span{color:var(--dim);font-weight:500;margin-left:8px}
tr.shrow{cursor:pointer}
tr.shrow:hover td{background:var(--panel)}
tr.shrow.isdone td{color:var(--dim)}
td.desc{max-width:420px;color:var(--muted)}
.sl-head .seg button{padding:5px 12px}
.sotools{display:flex;gap:8px;align-items:center;margin:-6px 0 14px}
.sotools .est{width:58px;display:inline-block;margin:0 4px}
.sotable td.grip{color:var(--dim);cursor:grab;width:18px;user-select:none;padding-right:0}
.sotable td.num{color:var(--dim);width:24px;font-variant-numeric:tabular-nums}
.sotable td.time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text);width:70px}
.sotable input.est{width:58px;padding:4px 6px}
.sotable tr.dragging{opacity:.4}
.sotable tr.drop td{box-shadow:inset 0 2px 0 var(--accent)}
tr.srow.day td{color:var(--text)}
.dayhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:500}
.dayhead input{width:auto;padding:4px 8px;background:var(--panel)}
.dayhead .dname{font-weight:700;width:140px;color:var(--accent)}
.dayhead label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dayhead .dsum{color:var(--dim);font-size:12px;margin-left:4px;flex:1}
tr.brow td{background:var(--panel)}
tr.brow .blabel{background:transparent;border-color:transparent;font-weight:600;padding:4px 6px}
tr.brow .blabel:hover{border-color:var(--line2)}
tr.wrow td{color:var(--dim);font-size:12px;padding:6px 10px 2px;border-bottom:0}

/* context menu */
#menu{position:fixed;z-index:70;min-width:220px;max-width:290px;background:#1b1f27;border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:none}
#menu.show{display:block}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:6px 9px;border-radius:6px;text-align:left;color:var(--text);font-size:12.5px}
.mi:hover{background:var(--hover)}
.mi .ic{color:var(--muted)}
.mi .k{margin-left:auto;color:var(--dim);font-size:11px;padding-left:12px}
.mi.danger,.mi.danger .ic{color:var(--danger)}
.mi:disabled{opacity:.4;pointer-events:none}
.msep{height:1px;background:var(--line2);margin:5px 4px}
.mhead{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 9px 3px}
.mrow{padding:4px 7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mrow input{padding:6px 8px}
.mrow .sw{width:20px;height:20px}
.mrow .chip{height:24px;min-width:0;padding:0 8px;font-size:11.5px}
.mlbl{font-size:11px;color:var(--muted);width:100%;margin-bottom:-1px}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50}
#modal.show{display:grid}
#modal .card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;width:min(620px,92vw);max-height:88vh;overflow:auto}
.kb{display:grid;grid-template-columns:1fr auto;gap:6px 20px;font-size:12.5px;color:var(--muted)}
.kb div:nth-child(even){text-align:right}
.dz{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);margin-bottom:10px}
.dz.over{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.imp-list{max-height:260px;overflow:auto;border:1px solid var(--line2);border-radius:8px;margin:8px 0 12px}
.imp-row{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.imp-row:last-child{border:0}
.imp-row input{accent-color:var(--accent);margin-top:2px}
.imp-row .h{font-weight:600}
.imp-row .c{font-size:11.5px;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#000;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media print{
  body{overflow:visible;background:#fff;color:#000}
  #app{display:block;height:auto}
  header,#sidebar,#stage,#inspector,#home,.sl-head .btn{display:none!important}
  #shotlist{display:block!important;background:#fff;padding:0;overflow:visible}
  th{position:static;background:#fff;color:#555} td{border-color:#ddd;color:#000!important} tr.srow td{color:#000}
}
</style>
</head>
<body>
<div id="app" class="home">
  <header>
    <div class="brand" id="brand" title="All projects"><div class="mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="#0b1020"><path d="M12 22 3 5a11 11 0 0 1 18 0z"/></svg></div>Overhead</div>
    <div class="crumbs proj-only"><span class="slash">/</span><button class="crumb" id="bHome"></button><span class="slash">/</span><input id="projName" spellcheck="false" title="Project name"></div>
    <div class="seg proj-only">
      <button data-view="diagram" class="on"></button>

function sceneNo(sc) {

function makeObject(type, kind, x, y, sc = cv()) {
  if (type === 'actor') {
    const n = sc.objects.filter(o=>o.type==='actor').length;
    const ch = kind && charById(kind);   // kind = character id when placing a saved character
    if (ch) return { id:uid(), type, layer:'block', charId:ch.id, name:ch.name, color:ch.color, shape:ch.shape, x, y, rot:180, path:[] };
    return { id:uid(), type, layer:'block', name:'Actor '+(n+1), color:COLORS[n%COLORS.length], shape:'person', x, y, rot:180, path:[] };
  }
  if (type === 'camera') {
    const n = sc.objects.filter(o=>o.type==='camera').length;
    return { id:uid(), type, layer:'block', name:'Cam '+letters(n), color:CAM_COLORS[n%CAM_COLORS.length], x, y, rot:0, lens:35, range:6, path:[] };
  }

}

// ---------- project library ----------
// Desktop app: each project is a "<name>.overhead.json" file in the library folder the user picks (like an Obsidian vault).
// Browser preview: falls back to localStorage.
const host = window.overheadHost || null;

// 3: scenes hold setups (each with its own objects + location); characters; actor shapes/sizes; scene numbers; bend points on moves
const LIB_KEY = 'overhead.library', PKEY = id => 'overhead.p.' + id;

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
let library = [];
const projCache = {};
const validProject = p => p && Array.isArray(p.scenes) && p.scenes.length && p.scenes.every(s=>(Array.isArray(s.objects)||Array.isArray(s.setups))&&Array.isArray(s.shots));
// bring older files up to the current shape (multi-point arrows, locations, setups)
function normalizeProject(p) {

    if (!Array.isArray(s.setups)) {
      s.setups = [{ id:uid(), name:'Setup 1', objects:s.objects || [], locationId:s.locationId || null }];
      delete s.objects; delete s.locationId;

<cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="top"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf></cellXfs>

  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');

// ---------- PNG export ----------
async function exportPNG() {
  const scn = scene(), sc = cv(), b = bounds(sc, state.showCones);
  if (!b) { toast('Nothing to export yet'); return; }
  const pad = 50, top = 40, w = b.w+pad*2, h = b.h+pad*2+top, x = b.x-pad, y = b.y-pad-top, S = 2;
  const str = `<svg xmlns="http://www.w3.org/2000/svg" width="${w*S}" height="${h*S}" viewBox="${x} ${y} ${w} ${h}"><defs>${gridDefs(1)}</defs>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${BG}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#grid)"/>
    <text x="${x+20}" y="${y+30}" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e7e9ee">${esc(sceneNo(scn))} · ${esc(scn.name)}${scn.setups.length > 1 ? ` · ${esc(sc.name)}` : ''}</text>
    ${renderLayers({ clean:true })}</svg>`;
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  try { await img.decode(); } catch (e) { toast('Export failed'); return; }
  const c = document.createElement('canvas'); c.width = w*S; c.height = h*S; c.getContext('2d').drawImage(img, 0, 0);
  c.toBlob(bl => { download(`${safeName()} - scene ${sceneNo(scn)}${scn.setups.length > 1 ? ` ${sc.name}` : ''}.png`, bl); toast('Diagram exported'); });
}

// ---------- script import ----------
const HEADING = /^(?:\d+[A-Z]?[.)]?\s+)?((?:INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\/E|INT|EXT|EST)[.\s].*?)(?:\s+\d+[A-Z]?\.?)?$/i;
const NOT_CHAR = /^(FADE|CUT|DISSOLVE|SMASH|MATCH|THE END|CONTINUED|MORE|BACK TO|INTERCUT|TITLE|SUPER|END|SCENE|OMITTED|ANGLE|CLOSE|WIDE|POV|INSERT)\b|TO:$/;
function cleanChar(t) { return t.replace(/^@/,'').replace(/\s*\(.*?\)\s*/g,' ').replace(/\^$/,'').replace(/\s+/g,' ').trim(); }
function parseScript(text) {
  if (/<FinalDraft/i.test(text)) return parseFDX(text);
  const lines = text.replace(/\r/g,'').split('\n'), scenes = [];
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i], t = raw.trim();
    if (!t) continue;
    let heading = null;
    if (/^\.[A-Za-z0-9]/.test(t) && !t.startsWith('..')) heading = t.slice(1);
    else { const m = t.match(HEADING); if (m && (t === t.toUpperCase() || /^(int|ext|est|i\/e)\./i.test(m[1]))) heading = m[1]; }
    if (heading) {
      cur = { heading:heading.replace(/\s*#[^#]*#\s*$/,'').replace(/\s+/g,' ').trim().toUpperCase(), chars:[], summary:'' };
      scenes.push(cur); continue;
    }
    if (!cur) continue;
    const prevBlank = i === 0 || !lines[i-1].trim(), next = (lines[i+1] || '').trim();
    const looksChar = t.startsWith('@') || (t === t.toUpperCase() && /[A-Z]/.test(t) && t.length <= 38 && !/^[(\[!]/.test(t) && !/[.!?:]$/.test(t.replace(/\(.*?\)/g,'').trim()) && !NOT_CHAR.test(t));
    if (looksChar && next && (prevBlank || /^\s{10,}/.test(raw))) {
      const name = cleanChar(t);
      if (name && !cur.chars.includes(name)) cur.chars.push(name);
      while (i+1 < lines.length && lines[i+1].trim()) i++;   // skip the dialogue block
      continue;
    }
    if (!cur.summary && !/^[(\[]/.test(t) && !NOT_CHAR.test(t) && !/^[>=#~]/.test(t)) cur.summary = t.slice(0, 240);
  }
  return scenes;
}
function parseFDX(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml'), scenes = [];
  let cur = null;
  for (const p of doc.querySelectorAll('Content > Paragraph')) {
    const type = p.getAttribute('Type'), text = [...p.querySelectorAll('Text')].map(t => t.textContent).join('').trim();
    if (!text) continue;
    if (type === 'Scene Heading') { cur = { heading:text.toUpperCase(), chars:[], summary:'' }; scenes.push(cur); }
    else if (cur && type === 'Character') { const n = cleanChar(text.toUpperCase()); if (n && !cur.chars.includes(n)) cur.chars.push(n); }
    else if (cur && type === 'Action' && !cur.summary) cur.summary = text.slice(0, 240);
  }
  return scenes;
}
let imp = null;
function openImport() {
  hideMenu();
  const emptyish = project.scenes.every(s => !allObjects(s).length && !s.shots.length);
  imp = { scenes:[], replace:emptyish, actors:true };
  $('#modalCard').innerHTML = `<div class="ih"><h2>Import script</h2><button class="ib" data-close>${ico('x')}</button></div>
    <div class="dz" id="dz">Drop a screenplay here or <button class="btn sm" id="impPick">Choose file…</button>
      <div class="hint" style="margin:6px 0 0">Fountain (.fountain), Final Draft (.fdx) or plain text. For a PDF, copy the text out of it and paste below.</div></div>
    <textarea id="impText" placeholder="…or paste screenplay text here" style="min-height:110px;font:12px/1.5 ui-monospace,monospace"></textarea>
    <div id="impResult"></div>`;
  $('#modal').classList.add('show');
  $('#impPick').onclick = () => { $('#scriptIn').value = ''; $('#scriptIn').click(); };
  const dz = $('#dz');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadScriptFile(f); });
  let tm; $('#impText').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => showImport(parseScript(e.target.value)), 200); });
  showImport([]);
}
$('#scriptIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadScriptFile(f); });
async function loadScriptFile(f) {
  if (/\.pdf$/i.test(f.name)) { toast('PDF import is coming. For now, copy the text out of the PDF and paste it here.'); return; }
  const text = await f.text();
  if (!/<FinalDraft/i.test(text)) $('#impText').value = text;
  else $('#impText').value = '', $('#impText').placeholder = `Loaded ${f.name}`;
  showImport(parseScript(text), f.name);
}
function showImport(scenes, fname) {
  imp.scenes = scenes.map(s => ({ ...s, on:true }));
  const r = $('#impResult');
  if (!scenes.length) { r.innerHTML = `<div class="hint">${fname ? `No scene headings found in ${esc(fname)}. ` : ''}Scenes are detected from headings like <kbd>INT. KITCHEN – NIGHT</kbd> or <kbd>EXT. STREET – DAY</kbd>.</div>`; return; }
  const chars = new Set(scenes.flatMap(s => s.chars));
  r.innerHTML = `<div class="st" style="margin-top:14px">Found ${plural(scenes.length,'scene')} · ${plural(chars.size,'character')}</div>
    <div class="imp-list">${imp.scenes.map((s,i) => `<label class="imp-row"><input type="checkbox" data-si="${i}" checked><div><div class="h">${i+1}. ${esc(s.heading)}</div>${s.chars.length?`<div class="c">${esc(s.chars.join(', '))}</div>`:''}</div></label>`).join('')}</div>
    <label class="check"><input type="checkbox" id="impActors" ${imp.actors?'checked':''}> Place each scene's characters as actors</label>
    <label class="check" style="margin-top:6px"><input type="checkbox" id="impReplace" ${imp.replace?'checked':''}> Replace existing scenes (otherwise add after them)</label>
    <div class="btns" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="impGo"></button></div>`;
  const count = () => { const n = imp.scenes.filter(s => s.on).length; $('#impGo').textContent = `Import ${plural(n,'scene')}`; $('#impGo').disabled = !n; };
  r.querySelectorAll('[data-si]').forEach(c => c.onchange = () => { imp.scenes[+c.dataset.si].on = c.checked; count(); });
  $('#impActors').onchange = e => imp.actors = e.target.checked;
  $('#impReplace').onchange = e => imp.replace = e.target.checked;
  $('#impGo').onclick = applyImport;
  count();
}
function applyImport() {
  const chosen = imp.scenes.filter(s => s.on); if (!chosen.length) return;
  pushUndo();
  // every speaking part becomes a saved character (reusing ones that already exist by name)
  const charFor = n => {
    let ch = project.characters.find(c => c.name === n);
    if (!ch) { ch = newCharacter(); ch.name = n; project.characters.push(ch); }
    return ch;
  };
  const made = chosen.map(s => {
    const sc = makeScene(s.heading); sc.notes = s.summary; sc.open = false;
    const u = sc.setups[0];
    const loc = project.locations.find(l => l.name === locationName(s.heading));   // reuse a saved set with the same name
    if (loc) applyLocation(u, loc);
    s.chars.forEach((n, i) => {
      const ch = charFor(n);
      if (!imp.actors) return;
      const o = makeObject('actor', ch.id, Math.round((i-(s.chars.length-1)/2)*75), 0, u);
      u.objects.push(o);
    });
    return sc;
  });
  if (imp.replace) project.scenes = made; else project.scenes.push(...made);
  made[0].open = true;
  state.sceneId = null; state.shotId = null; state.sel = null;
  switchScene(made[0].id); state.sceneSelected = true;
  applyMode(hasSet(made[0].setups[0]) ? 'block' : 'set'); fitView();
  $('#modal').classList.remove('show');
  refreshAll(); save(); toast(`Imported ${plural(made.length,'scene')}`);
}

function showHelp() {
  const k = [['Set mode ↔ Blocking mode','E'],['Select / Pan tool','V / H'],['Draw walls / Draw room','W / R'],['Door','D'],['Actor / Camera / Arrow','A / C / X'],['Light / Text','L / T'],
    ['Finish walls / arrow path','Enter · double-click · right-click'],['Select several','Drag a box on empty canvas · Shift+click'],['Select all','Ctrl/⌘ + A'],
    ['Pan','Space-drag, middle-drag, or hand tool (H)'],['Zoom','Scroll wheel · pinch · Ctrl+scroll'],['Fit set to view','F'],
    ['Quick actions','Right-click'],['Add move mark to selection','M'],['Drop a mark by dragging','Alt + drag'],['Bend a move (walk around something)','Drag the + on the move line'],
    ['Resize an actor','Drag its corner square'],['Place a saved character','Drag it from the sidebar'],['New setup for this scene','+ under the scene in the sidebar'],['Play / pause moves','P'],['Rotate selection','[  ]  (Shift = 45°)'],['Nudge','Arrows (Shift = ×4)'],
    ['Lock to 45° (rotate, walls, arrows, moves)','Hold Shift'],['Resize proportionally','Shift + drag corner'],['Ignore the grid','Hold Ctrl/⌘'],
    ['Keep tool after placing','Shift + click'],['Duplicate','Ctrl/⌘ + D'],['Delete','Delete'],['Undo / Redo','Ctrl/⌘ + Z / Shift+Z'],['Save now','Ctrl/⌘ + S'],['Deselect / stop tool','Esc']];
  $('#modalCard').innerHTML = `<div class="ih"><h2>Keyboard shortcuts</h2><button class="ib" data-close>${ico('x')}</button></div><div class="kb">${k.map(([a,b])=>`<div>${a}</div><div><kbd>${b}</kbd></div>`).join('')}</div>`;
  $('#modal').classList.add('show');
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) $('#modal').classList.remove('show'); });

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName), mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if ($('#modal').classList.contains('show')) { if (e.key === 'Escape') $('#modal').classList.remove('show'); return; }
  if (e.key === 'Escape') hideMenu();
  if (!project || state.view === 'home') return;
  if (mod && key === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && key === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (mod && key === 's') { e.preventDefault(); clearTimeout(saveTimer); storeProject(project); toast('Saved'); return; }
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  if (mod && key === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && key === 'a' && state.view === 'diagram') { e.preventDefault(); selectAll(); return; }
  if (mod) return;
  if (e.code === 'Space') { e.preventDefault(); if (!spaceDown) { spaceDown = true; renderCanvas(); } return; }
  if (state.view !== 'diagram') return;
  if (state.draw && (state.draw.kind === 'walls' || state.draw.kind === 'arrow')) {
    const finish = () => state.draw.kind === 'walls' ? finishWalls(false) : finishArrow();
    if (e.key === 'Enter') { finish(); return; }
    if (e.key === 'Escape') { finish(); setTool('select'); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); state.draw.pts.pop(); if (!state.draw.pts.length) state.draw = null; renderCanvas(); return; }
  }
  const step = e.shiftKey ? GRID*4 : (state.snap ? GRID : 5);
  switch (key) {
    case 'v': setTool('select'); break;
    case 'h': setTool('pan'); break;
    case 'e': setMode(state.mode === 'set' ? 'block' : 'set'); break;
    case 'w': setTool('walls'); break;
    case 'r': setTool('room'); break;
    case 'd': setTool('prop:door'); break;
    case 'a': setTool('actor'); break;
    case 'c': setTool('camera'); break;
    case 'x': setTool('arrow'); break;
    case 'l': setTool('prop:light'); break;
    case 't': setTool('prop:text'); break;
    case 'm': addMove(); break;
    case 'p': togglePlay(); break;
    case 'f': fitView(); renderCanvas(); break;
    case '[': case '{': rotateSel(e.shiftKey ? -45 : -15); break;
    case ']': case '}': rotateSel(e.shiftKey ? 45 : 15); break;
    case 'delete': case 'backspace': e.preventDefault(); deleteSel(); break;
    case 'arrowleft': e.preventDefault(); nudge(-step,0); break;
    case 'arrowright': e.preventDefault(); nudge(step,0); break;
    case 'arrowup': e.preventDefault(); nudge(0,-step); break;
    case 'arrowdown': e.preventDefault(); nudge(0,step); break;
    case '?': case '/': showHelp(); break;
    case 'escape':
      if (state.draw) { state.draw = null; renderCanvas(); }
      else if (state.tool !== 'select') setTool('select');
      else if (state.sel || state.multi.length) { select(null); refreshAll(); }
      else if (state.shotId) { state.shotId = null; refreshAll(); }
      break;
  }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; renderCanvas(); } });

// ---------- boot ----------
function refreshAll() {
  if (!project) return;
  updateHeader(); renderSidebar(); renderInspector(); renderCanvas(); renderBanner(); updatePlaybar();
  if (state.view === 'list') renderShotlist();
}
loadLibrary();
buildChrome();
setView('home');
if (host && host.updatedFrom && host.updatedFrom()) setTimeout(() => toast(`Updated to Overhead ${host.version}`), 400);
new ResizeObserver(() => renderCanvas()).observe(svg);
</script>
