# Builds the Windows and Mac apps and publishes them as a GitHub Release.
# Runs when you push a version tag, e.g.  git tag v0.2.0 && git push --tags
# Installed copies of Blockwise check these releases and update themselves.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          npx electron-builder --publish always
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
